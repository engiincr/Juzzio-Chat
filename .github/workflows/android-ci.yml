name: Juzzio CI — Güvenlik, Kalite Kapıları, Supabase ve APK Yayını

# Termux (scripts/push.sh) veya Windows CMD (scripts\push.bat) ile main dalına
# yapılan her push bu iş akışını başlatır. Elle çalıştırmak için: Actions → Run workflow.
#
# v0.9.0 güvenlik düzeni (denetim bulguları F/G):
#  • Üretim veritabanına dağıtım (supabase-sync) ancak TÜM kapılar geçince çalışır:
#    sır taraması (geçmiş dahil) + analiz/test + APK derlemesi + SQL testleri + Edge
#    Function tip kontrolü.
#  • Yayın işi eski Release/etiket/dal SİLMEZ. Aynı sürüm yeniden yayınlanırsa yalnızca
#    o sürümün dosyaları güncellenir (kapsamlı düzeltme). ci_guards.py bunu denetler.
#  • İzinler iş bazında en az yetki: yalnızca release işi contents:write alır.
#  • Üçüncü taraf eylemler tam commit SHA'sına sabitlenmiştir (yorumda sürüm).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy_supabase:
        description: "Supabase veritabanı ve Edge Function dağıtımı yapılsın mı?"
        type: boolean
        default: true

concurrency:
  group: juzzio-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable
  JAVA_VERSION: "17"

jobs:
  # ---------------------------------------------------------------------------
  # 1) Gizli anahtar taraması (güncel ağaç + TÜM Git geçmişi) ve yayın korumaları
  # ---------------------------------------------------------------------------
  secret-scan:
    name: "🛡️ Gizli Anahtar Taraması"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Takip edilmemesi gereken dosyalar
        run: |
          set -e
          bad=0
          for f in .env .env.local .env.production android/key.properties android/app/google-services.json; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error file=$f::Bu dosya Git'e eklenmemeli. 'git rm --cached $f' ile kaldırın."
              bad=1
            fi
          done
          exit $bad

      - name: Anahtar kalıpları (düz ve base64)
        run: |
          set -e
          python3 scripts/check_secrets.py
          PATTERN='(ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|sb_secret_[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|Z2hwX[A-Za-z0-9+/=]{20,}|c2Jfc2VjcmV0[A-Za-z0-9+/=]{10,}|"private_key"[[:space:]]*:)'
          if git grep -nIE "$PATTERN" -- . ':!.github/workflows/android-ci.yml' ':!scripts/push.sh' ':!scripts/push.bat' ':!scripts/check_secrets.py'; then
            echo "::error::Depoda gizli anahtar/token bulundu. Anahtarı iptal edip yenileyin ve dosyadan kaldırın."
            exit 1
          fi
          echo "Gizli anahtar bulunmadı ✅"

      - name: Git geçmişi sır taraması
        run: python3 scripts/check_secrets.py --history

      - name: Yayın/dağıtım korumaları (yıkıcı silme yok, kapılar bağlı)
        run: python3 scripts/ci_guards.py

  # ---------------------------------------------------------------------------
  # 2) Kod kalitesi: analiz + test
  # ---------------------------------------------------------------------------
  quality:
    name: "🔍 Analiz ve Test"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter sürümü (kanıt kaydı)
        run: flutter --version

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Kaynak bütünlüğü ve yerelleştirme kapıları
        run: |
          set -e
          python3 scripts/verify_tree.py
          python3 scripts/l10n_tools.py check
          python3 scripts/dart_lexcheck.py
          python3 scripts/gen_legal.py --check

      - name: Statik analiz (hatalar derlemeyi durdurur)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Birim ve widget testleri
        run: flutter test

      - name: version.json / release betiği kontrolü
        run: |
          python3 scripts/release_meta.py title
          cp version.json /tmp/version.json.bak
          python3 scripts/release_meta.py check
          cp /tmp/version.json.bak version.json

  # ---------------------------------------------------------------------------
  # 3) Veritabanı: kanonik SQL temiz kurulum ×2 (idempotentlik) + RLS testleri
  # ---------------------------------------------------------------------------
  sql-tests:
    name: "🧪 SQL ve RLS Testleri"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: psql istemcisi
        run: command -v psql >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null)
      - name: Kanonik SQL + testler
        run: bash scripts/sql_test.sh juzzio_ci_test

  # ---------------------------------------------------------------------------
  # 4) Edge Function tip kontrolü (Deno)
  # ---------------------------------------------------------------------------
  edge-check:
    name: "🦕 Edge Function Kontrolü"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: deno check
        run: |
          set -euo pipefail
          for f in supabase/functions/*/index.ts; do
            echo "▶ $f"
            deno check "$f"
          done
      - name: Edge yardımcı birim testleri (tsc + node)
        run: |
          set -euo pipefail
          npm install --global --no-fund --no-audit typescript@5.6.3
          bash scripts/edge_unit_test.sh

  # ---------------------------------------------------------------------------
  # 5) İmzalı APK
  # ---------------------------------------------------------------------------
  build-android:
    name: "🐦 APK Derleme"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # Android NDK + CMake her derlemede ~1-2 dk indiriliyordu; önbellekten gelsin
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-ndk-28.2.13676358-cmake-3.22.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Firebase yapılandırması (google-services.json)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 secret yok; APK push bildirimleri olmadan derlenecek."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json, sys
          data = json.load(open("android/app/google-services.json", encoding="utf-8"))
          pkgs = {c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in data.get("client", [])}
          if "com.juzzio.app" not in pkgs:
              sys.exit("google-services.json içinde com.juzzio.app paketi yok")
          print("Firebase yapılandırması doğrulandı.")
          PY

      - name: İmza anahtarı (key.properties)
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/ci_signing.sh

      - name: APK derle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          ML_DSA_PUBLIC_KEY: ${{ vars.ML_DSA_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          DEFINES=()
          [ -n "${ML_DSA_PUBLIC_KEY:-}" ] && DEFINES+=(--dart-define=ML_DSA_PUBLIC_KEY="$ML_DSA_PUBLIC_KEY")
          [ -n "${SUPABASE_URL:-}" ] && DEFINES+=(--dart-define=SUPABASE_URL="$SUPABASE_URL")
          [ -n "${SUPABASE_ANON_KEY:-}" ] && DEFINES+=(--dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY")
          [ -n "${LIVEKIT_URL:-}" ] && DEFINES+=(--dart-define=LIVEKIT_URL="$LIVEKIT_URL")
          # Tek sürüm kaynağı: scripts/release_meta.py build-number (pubspec +N ve CI çalıştırma
          # numarasından türetilir, her zaman artar). Uygulama içi Hakkında ekranı, OTA
          # karşılaştırması ve version.json aynı numarayı kullanır.
          BUILD_NO="$(python3 scripts/release_meta.py build-number "$GITHUB_RUN_NUMBER")"
          DEFINES+=(--dart-define=APP_BUILD="$BUILD_NO")
          flutter build apk --release --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation --build-number="$BUILD_NO" "${DEFINES[@]}"
          mkdir -p release-output
          echo "$BUILD_NO" > release-output/build_number.txt
          APP_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          cp build/app/outputs/flutter-apk/app-release.apk release-output/Juzzio-latest.apk
          cp build/app/outputs/flutter-apk/app-release.apk "release-output/juzzio-v${APP_VER}-release.apk"
          (cd release-output && sha256sum Juzzio-latest.apk > Juzzio-latest.apk.sha256 && sha256sum "juzzio-v${APP_VER}-release.apk" > "juzzio-v${APP_VER}-release.apk.sha256")

      - name: Geçici dosyaları temizle
        if: always()
        run: rm -f android/key.properties android/app/google-services.json

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: juzzio-apk
          path: release-output/
          retention-days: 14
          compression-level: 0

  # ---------------------------------------------------------------------------
  # 6) Supabase üretim dağıtımı — YALNIZCA tüm kapılar geçtikten sonra
  # ---------------------------------------------------------------------------
  supabase-sync:
    name: "🗄️ Supabase Migration & Edge Functions"
    needs: [secret-scan, quality, sql-tests, edge-check, build-android]
    # main'e push (push betiği = bilinçli yayın olayı) veya elle tetikleme. Otomatik
    # dağıtımı kapatmak için depo değişkeni: JUZZIO_SUPABASE_AUTO_DEPLOY = false
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy_supabase) ||
       (github.event_name == 'push' && vars.JUZZIO_SUPABASE_AUTO_DEPLOY != 'false'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Dağıtım öncesi şema anlık görüntüsü (geri dönüş kaydı)
        if: env.SUPABASE_DB_URL != ''
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          DB_URL="$(python3 scripts/resolve_db_url.py)"
          echo "::add-mask::$DB_URL"
          mkdir -p predeploy
          # Veri İÇERMEZ (kişisel veri artefakta konmaz): fonksiyon gövdeleri, politikalar,
          # sütunlar ve bucket ayarları. Kanonik dosya veri silmez; veri yedeği Supabase'in
          # günlük/PITR yedeğindedir.
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -At -f scripts/schema_snapshot.sql > predeploy/schema_snapshot.txt
          sha256sum predeploy/schema_snapshot.txt
          git rev-parse HEAD > predeploy/commit.txt

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: env.SUPABASE_DB_URL != ''
        with:
          name: predeploy-schema-snapshot
          path: predeploy/
          retention-days: 90

      - name: Veritabanı dosyasını uygula
        if: env.SUPABASE_DB_URL != ''
        run: |
          set -euo pipefail
          DB_URL="$(python3 scripts/resolve_db_url.py)"
          echo "::add-mask::$DB_URL"
          PSQL="psql $DB_URL -v ON_ERROR_STOP=1 -q -X"
          # Tek kanonik veritabanı dosyası: içerik özeti (SHA-256) değiştiğinde tamamı
          # tek transaction içinde uygulanır (dosya idempotenttir; hata olursa hiçbir şey değişmez).
          DB_FILE="supabase/juzzio_database.sql"
          DB_NAME="$(basename "$DB_FILE")"
          DB_SUM="$(sha256sum "$DB_FILE" | cut -d' ' -f1)"
          $PSQL -c "CREATE TABLE IF NOT EXISTS public.juzzio_schema_migrations (filename text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now()); ALTER TABLE public.juzzio_schema_migrations ADD COLUMN IF NOT EXISTS checksum text; ALTER TABLE public.juzzio_schema_migrations ADD COLUMN IF NOT EXISTS commit_sha text; REVOKE ALL ON public.juzzio_schema_migrations FROM anon, authenticated;"
          DONE_ALREADY=$($PSQL -tAc "SELECT 1 FROM public.juzzio_schema_migrations WHERE filename = '$DB_NAME' AND checksum = '$DB_SUM'")
          if [ "$DONE_ALREADY" = "1" ]; then
            echo "⏭  $DB_NAME değişmedi (özet: ${DB_SUM:0:12})"
          else
            echo "▶  $DB_NAME uygulanıyor (özet: ${DB_SUM:0:12})..."
            $PSQL --single-transaction -f "$DB_FILE"
            $PSQL -c "INSERT INTO public.juzzio_schema_migrations(filename, checksum, commit_sha, applied_at) VALUES ('$DB_NAME', '$DB_SUM', '$GITHUB_SHA', now()) ON CONFLICT (filename) DO UPDATE SET checksum = EXCLUDED.checksum, commit_sha = EXCLUDED.commit_sha, applied_at = now()"
            echo "✅ $DB_NAME uygulandı"
          fi

      - name: Migration atlandı
        if: env.SUPABASE_DB_URL == ''
        run: echo "::warning::SUPABASE_DB_URL secret tanımlı değil; veritabanı migration'ları atlandı."

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        with:
          node-version: '22'

      # JWT doğrulaması platformda kapalı (--no-verify-jwt) çünkü her fonksiyon kimliği
      # gövdede ELLE doğrular; tehdit modeli docs/EDGE_FUNCTIONS_SECURITY.md:
      #  • get-livekit-token, translate-bridge, content-moderation → requireUser() (auth.getUser)
      #  • push-webhook → x-webhook-secret (sabit zamanlı karşılaştırma) veya kullanıcı JWT
      #  • auth-username-login → giriş öncesi; hız sınırı + sabit gecikme
      #  • storage-cleanup → x-cron-secret (sabit zamanlı) veya kullanıcı JWT + "settings" izni
      - name: Edge Function'ları dağıt
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: |
          set -euo pipefail
          for fn in get-livekit-token translate-bridge push-webhook auth-username-login content-moderation storage-cleanup; do
            npx --yes supabase@2 functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
          done

      - name: Edge Function dağıtımı atlandı
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_REF == ''
        run: echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secret'ları tanımlı değil; Edge Function dağıtımı atlandı."

  # ---------------------------------------------------------------------------
  # 7) Yayın: tüm kapılar + (varsa) veritabanı dağıtımı başarılıysa
  # ---------------------------------------------------------------------------
  release:
    name: "🚀 GitHub Release ve OTA"
    needs: [secret-scan, quality, sql-tests, edge-check, build-android, supabase-sync]
    # APK, yeni RPC'leri kullanır: veritabanı dağıtımı başarısızsa APK yayınlanmaz.
    # (supabase-sync bilinçli olarak kapatıldıysa "skipped" kabul edilir.)
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.secret-scan.result == 'success' && needs.quality.result == 'success' &&
      needs.sql-tests.result == 'success' && needs.edge-check.result == 'success' &&
      needs.build-android.result == 'success' &&
      (needs.supabase-sync.result == 'success' || needs.supabase-sync.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: juzzio-apk
          path: release-output

      - name: GitHub Release yayınla ve version.json güncelle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ML_DSA_SEED: ${{ secrets.ML_DSA_SEED }}
        run: |
          set -euo pipefail
          APP_VER=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1 | tr -d '\r')
          SHA=$(awk '{print $1}' release-output/Juzzio-latest.apk.sha256)
          SIZE=$(awk "BEGIN {printf \"%.2f MB\", $(stat -c%s release-output/Juzzio-latest.apk)/1048576}")
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          export JUZZIO_BUILD_NUMBER=$(cat release-output/build_number.txt 2>/dev/null || echo "")
          python3 scripts/release_meta.py update "$SHA" "$SIZE" "$DATE"
          # Kuantum sonrası yayın imzası (ML-DSA-65, FIPS 204) — ML_DSA_SEED varsa
          if [ -n "${ML_DSA_SEED:-}" ]; then
            python3 -m pip install -q "cryptography>=46" && python3 scripts/mldsa_sign.py version.json
          fi
          TITLE=$(python3 scripts/release_meta.py title)

          TAG="v${APP_VER}"
          ASSETS=(release-output/Juzzio-latest.apk release-output/Juzzio-latest.apk.sha256 "release-output/juzzio-v${APP_VER}-release.apk" "release-output/juzzio-v${APP_VER}-release.apk.sha256")
          # Eski sürümler, etiketler ve dallar KORUNUR (geri dönüş için gereklidir).
          # Aynı sürüm tekrar derlenirse yalnızca BU sürümün dosyaları ve notları güncellenir.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "Juzzio $TAG — $TITLE" --notes-file release-notes.md --draft=false --prerelease=false --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" --target "$GITHUB_SHA" \
              --title "Juzzio $TAG — $TITLE" --notes-file release-notes.md --draft=false --prerelease=false --latest
          fi

          # Contributors'ta yalnızca depo sahibi görünsün diye otomatik commit
          # sahibin GitHub noreply kimliğiyle atılır (github-actions[bot] görünmez).
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add version.json README.md release-notes.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: v${APP_VER} APK SHA-256 doğrulaması [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi

      # Yeni sürüm yayınlandığı anda app_releases tablosuna (ayrıntılı notlarla)
      # eklenir; uygulamalar bunu realtime ile anında görür.
      - name: Tüm kullanıcılara anında güncelleme bildirimi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then echo "SUPABASE_DB_URL yok, atlandı"; exit 0; fi
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          DB_URL="$(python3 scripts/resolve_db_url.py)"
          echo "::add-mask::$DB_URL"
          python3 scripts/release_meta.py publish-sql > /tmp/publish_release.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -X -f /tmp/publish_release.sql
          echo "app_releases güncellendi; kullanıcılara anlık bildirim gönderildi"
