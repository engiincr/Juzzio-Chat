name: juzzio
description: "JUZZIO - Zero-Latency Bidirectional Translation, LiveKit Group Conference Audio/Video Call & Voice Note Messenger"
publish_to: 'none'
version: 0.9.9+99

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Sistem metinleri (tarih seçici, kopyala/yapıştır menüsü) ve RTL yazı yönü
  flutter_localizations:
    sdk: flutter

  # Backend, Auth, Realtime & Storage
  supabase_flutter: ^2.5.0

  # Gerçek Zamanlı SFU Ses/Görüntü ve DataChannel Altyapısı (flutter_webrtc dahildir)
  livekit_client: 2.13.2

  # Deepgram Nova-2 WebSocket & HTTP Çeviri Köprüsü
  web_socket_channel: ^3.0.1
  http: ^1.2.2

  # Asenkron Sesli Mesaj (.m4a / AAC) Kayıt, Oynatma ve Medya Seçimi
  record: ^5.1.2
  just_audio: ^0.9.40
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  # v0.9.3: hikâye fotoğraflarında ayarlanabilir güzelleştirme (çözme/kodlama, saf Dart)
  image: ^4.2.0
  # v0.9.4: sohbette belge gönderme (PDF/ZIP/DOCX…), belgeyi açma ve konum paylaşımı
  # v0.9.9: ^13 — <12 sürümleri win32 ^5 ister; flutter_secure_storage ^11 (win32 ^6) ile çakışıyordu.
  # flutter_secure_storage düşürülmedi: cihazlardaki E2EE anahtarları v11 formatında saklı.
  file_picker: ^13.3.2
  open_filex: ^4.5.0
  geolocator: '>=13.0.1 <15.0.0'
  # v0.9.6: mobil veride aramada 'Veri Koruma' önerisi
  connectivity_plus: '>=6.0.0 <8.0.0'
  # v0.9.7: Drift (SQLite) yerel önbellek — kod üretimi (build_runner) gerektirmez
  drift: ^2.20.0
  sqlite3_flutter_libs: '>=0.5.0 <0.7.0'

  # Hikâye ve sohbet videolarını oynatma
  video_player: ^2.9.2

  # v0.3.0: profil web sitesi bağlantısı, profil müziği (v0.7.0: isimle arama, just_audio önizleme),
  # aramada pil uyarıları, cihaz kimliği ve yönetici "beni hatırla" (şifreli depolama)
  url_launcher: ^6.3.0
  battery_plus: ^7.0.0
  flutter_secure_storage: ^11.0.0
  # v0.7.0: uçtan uca şifreleme (X25519 + HKDF + AES-256-GCM), saf Dart
  cryptography: ^2.7.0
  # v0.8.0: şifreli sohbet yedeği için Google hesabı seçimi (Drive appDataFolder)
  google_sign_in: 6.2.2

  # v0.4.0: profil kartındaki QR kod
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  record_platform_interface: 1.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/juzzio_logo.png
    - assets/creator/engin.jpg
    # v0.9.5: giden arama bekleme tonu (kendi ürettiğimiz 400+450 Hz çift tonu, telifsiz)
    - assets/sounds/juzzio_ringback.wav
    # v0.9.9: kumaş yenileme — 3D kil el poz/yumruk sprite'ları ve kavisli kumaş kıvrım haritaları
    #         (tools/cloth_render ile kendi ürettiğimiz özgün görseller)
    - assets/cloth/

  # v0.5: Uygulama genelinde tek ve tutarlı emoji görünümü (mesajlar, tepkiler,
  # emoji seçici, hikâye çıkartmaları). Noto Color Emoji — SIL Open Font License 1.1
  # (lisans: assets/fonts/NotoColorEmoji-OFL.txt). Apple emoji yazı tipi lisans
  # gereği uygulamaya gömülemez; bu set ücretsiz ve yeniden dağıtılabilirdir.
  fonts:
    - family: JuzzioEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
