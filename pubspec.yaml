name: juzzio
description: "JUZZIO - Zero-Latency Bidirectional Translation, LiveKit Group Conference Audio/Video Call & Voice Note Messenger"
publish_to: 'none'
version: 2.0.0+200

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Sistem metinleri (tarih seçici, kopyala/yapıştır menüsü) ve RTL yazı yönü
  flutter_localizations:
    sdk: flutter

  # Backend, Auth, Realtime & Storage
  supabase_flutter: ^2.5.0

  # Gerçek Zamanlı SFU Ses/Görüntü ve DataChannel Altyapısı (flutter_webrtc dahildir)
  livekit_client: 2.13.2

  # Deepgram Nova-2 WebSocket & HTTP Çeviri Köprüsü
  web_socket_channel: ^3.0.1
  http: ^1.2.2

  # Asenkron Sesli Mesaj (.m4a / AAC) Kayıt, Oynatma ve Medya Seçimi
  record: ^5.1.2
  just_audio: ^0.9.40
  # v1.2.9: başka uygulama ses çalınca / arama gelince müzikler durur (just_audio'nun kendi bağımlılığı)
  audio_session: ^0.1.21
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  # v0.9.3: hikâye fotoğraflarında ayarlanabilir güzelleştirme (çözme/kodlama, saf Dart)
  image: ^4.2.0
  # v0.9.4: sohbette belge gönderme (PDF/ZIP/DOCX…), belgeyi açma ve konum paylaşımı
  # v0.9.9: ^13 — <12 sürümleri win32 ^5 ister; flutter_secure_storage ^11 (win32 ^6) ile çakışıyordu.
  # flutter_secure_storage düşürülmedi: cihazlardaki E2EE anahtarları v11 formatında saklı.
  file_picker: ^13.3.2
  open_filex: ^4.5.0
  geolocator: '>=13.0.1 <15.0.0'
  # v0.9.6: mobil veride aramada 'Veri Koruma' önerisi
  connectivity_plus: '>=6.0.0 <8.0.0'
  # v0.9.7: Drift (SQLite) yerel önbellek — kod üretimi (build_runner) gerektirmez
  drift: ^2.20.0
  sqlite3_flutter_libs: '>=0.5.0 <0.7.0'

  # Hikâye ve sohbet videolarını oynatma
  video_player: ^2.9.2
  # v1.2.8: Sinema Parti — her bağlantı (YouTube, kendi oynatıcılı siteler) uygulama içi
  # tarayıcıda açılır; gömülü çerçevelerdeki video bulunup herkeste eşitlenir
  flutter_inappwebview: ^6.1.5
  # v1.2.8: gönderilen videolar 720p / 30 fps'e sıkıştırılır
  video_compress: ^3.1.4

  # v0.3.0: profil web sitesi bağlantısı, profil müziği (v0.7.0: isimle arama, just_audio önizleme),
  # aramada pil uyarıları, cihaz kimliği ve yönetici "beni hatırla" (şifreli depolama)
  url_launcher: ^6.3.0
  battery_plus: ^7.0.0
  flutter_secure_storage: ^11.0.0
  # v0.7.0: uçtan uca şifreleme (X25519 + HKDF + AES-256-GCM), saf Dart
  cryptography: ^2.7.0

  # v1.2.9: yasal teslim paketi — antetli PDF rapor + AES-256 şifreli ZIP (ikisi de saf Dart, yerel kod yok)
  pdf: ^3.11.1
  archive: ^4.0.2
  crypto: ^3.0.3
  # v0.8.0: şifreli sohbet yedeği için Google hesabı seçimi (Drive appDataFolder)
  google_sign_in: 6.2.2

  # v0.4.0: profil kartındaki QR kod
  qr_flutter: ^4.1.0
  just_audio_windows: ^0.2.3
  video_player_win: ^3.3.1
  local_notifier: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  record_platform_interface: 1.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/juzzio_logo.png
    - assets/creator/engin.jpg
    # v1.2.4: yapımcı tanıtım videosu (Hello… — 26 sn, 1,3 MB)
    - assets/creator/juzzio_creator_reel.mp4
    # v1.2.7: 20 sn uygulama tanıtım videosu (ilk giriş + Yapımcı sayfası), TR/EN
    - assets/intro/juzzio_intro_tr.mp4
    - assets/intro/juzzio_intro_en.mp4
    - assets/intro/juzzio_whatsnew_tr.mp4
    - assets/intro/juzzio_whatsnew_en.mp4
    # v1.2.9: yasal PDF raporu — şeffaf antet logosu ve Türkçe karakterli gömülü yazı tipi (Liberation Sans, OFL)
    - assets/images/pdf_logo.png
    # v1.2.9: hava teması ve Ay evresi görselleri (kodla üretildi: tools/weather_sprites.py)
    - assets/weather/moon.png
    - assets/weather/sun.png
    - assets/weather/cloud_a.png
    - assets/weather/cloud_b.png
    - assets/fonts/pdf/LiberationSans-Regular.ttf
    - assets/fonts/pdf/LiberationSans-Bold.ttf
    - assets/fonts/pdf/LiberationSans-LICENSE.txt
    # v0.9.5: giden arama bekleme tonu (kendi ürettiğimiz 400+450 Hz çift tonu, telifsiz)
    - assets/sounds/juzzio_ringback.wav
    # v1.2.9: arama yeniden bağlanma tonu (kodla üretildi, telifsiz)
    - assets/sounds/juzzio_reconnect.wav
    # v1.2.9: emoji yazı tipinin lisans metni (Lisanslar sayfasında gösterilir)
    - assets/fonts/NotoColorEmoji-OFL.txt
    # v1.1.1: kumaş yenileme artık tamamen vektörle çiziliyor (assets/cloth kaldırıldı, −1,1 MB)

  # v0.5: Uygulama genelinde tek ve tutarlı emoji görünümü (mesajlar, tepkiler,
  # emoji seçici, hikâye çıkartmaları). Noto Color Emoji — SIL Open Font License 1.1
  # (lisans: assets/fonts/NotoColorEmoji-OFL.txt). Apple emoji yazı tipi lisans
  # gereği uygulamaya gömülemez; bu set ücretsiz ve yeniden dağıtılabilirdir.
  fonts:
    - family: JuzzioEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
